{{- if .Values.miniRuntime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "mini-runtime") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "mini-runtime") | nindent 4 }}
  {{- if .Values.imageAutoUpdate.enabled }}
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: {{ quote .Values.imageAutoUpdate.pollSchedule }}
    keel.sh/monitorContainers: "akto-api-security-runtime"
  {{- end }}
spec:
  replicas: {{ .Values.miniRuntime.replicas }}
  selector:
    matchLabels:
      {{- include "akto-regional-setup.componentSelectorLabels" (list . "mini-runtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akto-regional-setup.componentSelectorLabels" (list . "mini-runtime") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "akto-regional-setup.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      restartPolicy: Always
      containers:
      - name: akto-api-security-runtime
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: {{ include "akto-regional-setup.image" .Values.miniRuntime.image | quote }}
        imagePullPolicy: {{ .Values.miniRuntime.image.pullPolicy }}
        env:
        {{- include "akto-regional-setup.commonEnv" . | nindent 8 }}
        - name: RUNTIME_MODE
          value: "hybrid"
        - name: AKTO_INSTANCE_TYPE
          value: {{ quote .Values.miniRuntime.env.aktoInstanceType }}
        - name: AKTO_KAFKA_BROKER_URL
          value: {{ include "akto-regional-setup.miniRuntime.brokerForRuntime" . | quote }}
        - name: AKTO_KAFKA_BROKER_MAL
          value: {{ include "akto-regional-setup.miniRuntime.brokerForRuntime" . | quote }}
        - name: AKTO_KAFKA_GROUP_ID_CONFIG
          value: {{ quote .Values.miniRuntime.env.aktoKafkaGroupIdConfig }}
        - name: AKTO_KAFKA_MAX_POLL_RECORDS_CONFIG
          value: {{ quote .Values.miniRuntime.env.aktoKafkaMaxPollRecordsConfig }}
        - name: AKTO_KAFKA_TOPIC_NAME
          value: {{ quote .Values.miniRuntime.env.aktoKafkaTopicName }}
        - name: AKTO_TRAFFIC_BATCH_SIZE
          value: {{ quote .Values.miniRuntime.env.aktoTrafficBatchSize }}
        - name: AKTO_TRAFFIC_BATCH_TIME_SECS
          value: {{ quote .Values.miniRuntime.env.aktoTrafficBatchTimeSecs }}
        - name: PUPPETEER_REPLAY_SERVICE_URL
          value: {{ quote .Values.miniRuntime.env.puppeteerReplayServiceUrl }}
        - name: AKTO_RUN_MCP_JOBS
          value: {{ quote .Values.miniRuntime.env.aktoRunMcpJobs }}
        - name: SEND_TO_THREAT_ENABLED
          value: {{ quote .Values.miniRuntime.env.sendToThreatEnabled }}
        - name: USE_HOSTNAME
          value: {{ quote .Values.miniRuntime.env.useHostName }}
        # Auto-wired to the central cloud.
        - name: DATABASE_ABSTRACTOR_SERVICE_URL
          value: {{ include "akto-regional-setup.central.databaseAbstractorUrl" . | quote }}
        - name: AGENT_QUERY_LOGS_SERVICE_URL
          value: {{ .Values.miniRuntime.env.agentQueryLogsServiceUrl | default (include "akto-regional-setup.central.databaseAbstractorUrl" .) | quote }}
        - name: AKTO_GUARDRAIL_REDACTION_ENABLED
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionEnabled }}
        {{- if eq (toString .Values.miniRuntime.env.guardrailRedactionEnabled) "true" }}
        # Auto-wired to the guardrails service in this release.
        - name: AKTO_GUARDRAIL_REDACTION_URL
          value: {{ include "akto-regional-setup.miniRuntime.redactionUrl" . | quote }}
        {{- end }}
        - name: AKTO_GUARDRAIL_REDACTION_SKIP_ON_UNAVAILABLE
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionSkipOnUnavailable }}
        - name: AKTO_GUARDRAIL_REDACTION_CALL_TIMEOUT_MS
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionCallTimeoutMs }}
        - name: AKTO_GUARDRAIL_REDACTION_CONNECT_TIMEOUT_MS
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionConnectTimeoutMs }}
        - name: AKTO_GUARDRAIL_REDACTION_BUDGET_MS
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionBudgetMs }}
        - name: AKTO_GUARDRAIL_REDACTION_CHUNK_SIZE
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionChunkSize }}
        - name: AKTO_GUARDRAIL_REDACTION_MAX_PAYLOAD_BYTES
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionMaxPayloadBytes }}
        - name: AKTO_GUARDRAIL_REDACTION_QUEUE_CAPACITY
          value: {{ quote .Values.miniRuntime.env.guardrailRedactionQueueCapacity }}
        {{- include "akto-regional-setup.central.tokenEnv" . | nindent 8 }}
        {{- include "akto-regional-setup.kafka.clientSaslEnv" (list . .Values.miniRuntime.external) | nindent 8 }}
        resources:
          {{- toYaml .Values.miniRuntime.resources | nindent 10 }}
        volumeMounts:
          {{- include "akto-regional-setup.keyVault.volumeMounts" . | nindent 8 }}
      {{- if not .Values.miniRuntime.external.enabled }}
      {{- include "akto-regional-setup.kafka.brokerContainer" (list . "mini-runtime" .Values.miniRuntime.kafka .Values.miniRuntime.service.kafkaPort) | nindent 6 }}
      {{- end }}
      volumes:
        {{- include "akto-regional-setup.keyVault.volumes" . | nindent 6 }}
      {{- include "akto-regional-setup.scheduling" . | nindent 6 }}
{{- if not .Values.miniRuntime.external.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "mini-runtime") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "mini-runtime") | nindent 4 }}
  {{- with .Values.miniRuntime.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.miniRuntime.service.type }}
  selector:
    {{- include "akto-regional-setup.componentSelectorLabels" (list . "mini-runtime") | nindent 4 }}
  ports:
  - name: kafka
    port: {{ .Values.miniRuntime.service.kafkaPort }}
    targetPort: {{ .Values.miniRuntime.service.kafkaPort }}
    protocol: TCP
{{- end }}
{{- end }}
