{{- if .Values.agentGuard.enabled }}
{{- if (.Values.agentGuard.serviceAccount | default dict).create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "akto-regional-setup.agentGuard.serviceAccountName" . }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "agent-guard") | nindent 4 }}
  {{- with .Values.agentGuard.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "agent-guard") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "agent-guard") | nindent 4 }}
spec:
  replicas: {{ .Values.agentGuard.replicas }}
  selector:
    matchLabels:
      {{- include "akto-regional-setup.componentSelectorLabels" (list . "agent-guard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akto-regional-setup.componentSelectorLabels" (list . "agent-guard") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "akto-regional-setup.agentGuard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: agent-guard
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.agentGuard.image.repository }}:{{ .Values.agentGuard.image.tag }}"
        imagePullPolicy: {{ .Values.agentGuard.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.agentGuard.service.targetPort }}
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PORT
          value: {{ quote .Values.agentGuard.service.targetPort }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.global.kubernetesClusterDomain }}
        {{- if .Values.anonymizer.enabled }}
        # Auto-wired to the anonymizer in this release.
        - name: ANONYMIZER_URL
          value: {{ include "akto-regional-setup.anonymizer.url" . | quote }}
        {{- end }}
        # Auto-wired to the central cloud.
        - name: DATABASE_ABSTRACTOR_SERVICE_URL
          value: {{ include "akto-regional-setup.central.databaseAbstractorUrl" . | quote }}
        {{- include "akto-regional-setup.central.tokenEnv" . | nindent 8 }}
        {{- with .Values.agentGuard.env.slackWebhookUrl }}
        - name: SLACK_WEBHOOK_URL
          value: {{ quote . }}
        {{- end }}
        {{- include "akto-regional-setup.agentGuard.secretEnv" . | nindent 8 }}
        {{- include "akto-regional-setup.agentGuard.providerEnv" . | nindent 8 }}
        {{- include "akto-regional-setup.probes" (list .Values.agentGuard .Values.agentGuard.service.targetPort) | nindent 8 }}
        resources:
          {{- toYaml .Values.agentGuard.resources | nindent 10 }}
        volumeMounts:
          {{- include "akto-regional-setup.keyVault.volumeMounts" . | nindent 8 }}
      volumes:
        {{- include "akto-regional-setup.keyVault.volumes" . | nindent 6 }}
      {{- include "akto-regional-setup.scheduling" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "akto-regional-setup.componentName" (list . "agent-guard") }}
  labels:
    {{- include "akto-regional-setup.componentLabels" (list . "agent-guard") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "akto-regional-setup.componentSelectorLabels" (list . "agent-guard") | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.agentGuard.service.port }}
    targetPort: {{ .Values.agentGuard.service.targetPort }}
    protocol: TCP
{{- end }}
