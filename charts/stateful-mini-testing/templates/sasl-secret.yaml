{{- if and .Values.testing.kafka1.useSasl .Values.testing.kafka1.env.useSecretsForSaslCredentials (not .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret) .Values.testing.kafka1.env.saslCredentialsSecrets.username .Values.testing.kafka1.env.saslCredentialsSecrets.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-mini-testing-sasl" (include "akto.fullname" .) }}
  labels:
    {{- include "akto.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.username | b64enc }}
  password: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.password | b64enc }}
{{- end }}
