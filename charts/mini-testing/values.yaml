tokens:
  env:
    proxyUri: ""
    noProxy: ""

# Busybox image for init containers
busybox:
  image:
    repository: busybox
    digest: sha256:b3255e7dfbcd10cb367af0d409747d511aeb66dfac98cf30e97e87e4207dd76f

testing:
  aktoApiSecurityTesting:
    env:
      aktoAccountName: Helios
      aktoConfigName: staging
      newTestingEnabled: "true"
      kafkaBrokerUrl: localhost:29092
      puppeteerReplayServiceUrl: http://localhost:3000
      databaseAbstractorUrl: https://cyborg.akto.io
      automatedAgentBaseUrl: http://localhost:8000
      # If you want to use secrets to store database abstractor token. default: false
      useSecretsForDatabaseAbstractorToken: false
      # If not using secrets, place token here.
      databaseAbstractorToken: ""
      # If using secrets, place token here.
      databaseAbstractorTokenSecrets: 
        # Name of an existing secret containing the Database Abstractor Token
        existingSecret: ""
        # Token to use if existingSecret is not provided
        token: ""
      blockLogs: "false"
      aktoLogLevel: WARN
      miniTestingName: "akto-external-testing"

    image:
      repository: public.ecr.aws/aktosecurity/akto-api-security-mini-testing
      tag: 1.74.8_local
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "200m"
        memory: "500Mi"
      limits:
        cpu: 2
        memory: "8Gi"

  prometheusServer:
    name: prometheus # name of port defined in the service/container
    port: 9400
    protocol: TCP
    metricsEndpoint:
      path: /metrics

  # Configuration for in-cluster Prometheus (default)
  kubePrometheus:
    enabled: true  # Set to false when using Grafana Cloud
    serviceName: prometheus-kube-prometheus-prometheus
    namespace: ""  # Leave empty to use same namespace as release
    port: 9090
    scrape:
      interval: 15s
      timeout: 10s

  # Configuration for Grafana Cloud (external Prometheus)
  # Set kubePrometheus.enabled=false when using this
  # Requires grafana-cloud-setup chart to be installed first
  grafanaCloud:
    enabled: false
    # Prometheus query endpoint (for KEDA to read metrics)
    queryUrl: ""  # e.g., https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom
    # Username/Instance ID
    username: ""  # e.g., 2781763
    # API token for KEDA to query metrics (set via --set for security)
    readToken: ""
    # Secret name containing the read token
    secretName: grafana-cloud-tokens

  replicas: 1
  autoScaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    customMetrics:
      type: prometheus
      pollingInterval: 30
      cooldownPeriod: 300
      isModuleBusy:
        metricName: is_module_busy
        trigger:
          name: is_module_busy_avg
          target: 0.9
          type: Value

  aktoApiSecurityPuppeteerReplay:
    env:
      useSecretsForLogSenderApiKey: false
      logSenderApiKey: ""
      logSenderApiKeySecrets:
        existingSecret: ""
        token: ""
    image:
      repository: public.ecr.aws/aktosecurity/akto-puppeteer-replay
      tag: 1.51.1_latest
    imagePullPolicy: Always
    resources:
      requests:
        cpu: 1
        memory: "2Gi"
      limits:
        cpu: 1
        memory: "4Gi"

  aiAutomatedTesting:
    enabled: true
    image:
      repository: public.ecr.aws/aktosecurity/akto-ai-automated-testing
      tag: latest
    imagePullPolicy: Always
    port: 8000
    resources:
      requests:
        cpu: "250m"
        memory: "700Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  agentTesting:
    enabled: false
    image:
      repository: public.ecr.aws/aktosecurity/akto-agentic-testing
      tag: latest
    imagePullPolicy: Always
    port: 5500
    env:
      nodeEnv: "production"
      agenticMode: false
      nodeTlsRejectUnauthorized: "0"
      useSessionManagement: true
      aktoUtilityServer: "http://localhost:8001"
      # DEPRECATED - use llm.anthropic.* below. Still honoured, and still
      # writes the key in plaintext when useSecretsForAnthropicApiKey is false.
      # Ignored if llm.anthropic.apiKey or llm.anthropic.existingSecret is set.
      useSecretsForAnthropicApiKey: false
      anthropicApiKey: ""
      anthropicApiKeySecrets:
        existingSecret: ""
        anthropicSecretKey: ""
      llm:
        # bedrock | vertex | azure | anthropic. Blank lets the service
        # auto-detect from whichever credentials are set.
        provider: ""
        # Model roles, per provider below. analysis = validation/remediation,
        # fast = extraction and the agent fallback, agent = the attack loop.
        # Every credential below: set existingSecret to read from a Secret you
        # manage, or set the value inline and the chart creates one for you.
        azure:
          endpoint: ""
          model: ""
          apiKey: ""
          existingSecret: ""
          existingSecretKey: azureOpenAiApiKey
        vertex:
          projectId: ""
          location: ""
          endpointId: ""
          endpointDomain: ""
          credentialsJson: ""
          analysisModelId: ""
          fastModelId: ""
          agentModelId: ""
          existingSecret: ""
          existingSecretKey: googleCredentialsJson
        anthropic:
          analysisModelId: ""
          fastModelId: ""
          agentModelId: ""
          apiKey: ""
          existingSecret: ""
          existingSecretKey: anthropicApiKey
        bedrock:
          awsRegion: ""
          inferenceProfilePrefix: ""
          analysisModelId: ""
          fastModelId: ""
          agentModelId: ""
          # Optional - omit to use the pod's IAM role (IRSA).
          bearerToken: ""
          existingSecret: ""
          existingSecretKey: awsBearerTokenBedrock
    resources:
      requests:
        cpu: "250m"
        memory: "500Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  kafka1:
    env:
      # add advertised listeners if you want to override the default listeners
      kafkaAdvertisedListeners: ""
      kafkaBrokerId: "1"
      kafkaCleanupPolicy: delete
      kafkaCreateTopics: akto.test.messages:1:1
      kafkaInterBrokerListenerName: LISTENER_DOCKER_EXTERNAL_LOCALHOST
      kafkaListenerSecurityProtocolMap: CONTROLLER:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_LOCALHOST:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_DIFFHOST:PLAINTEXT
      kafkaListenerSecurityProtocolMapSsl: CONTROLLER:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_LOCALHOST:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_DIFFHOST:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_DIFFHOST_ENCRYPTED:SSL
      kafkaListenerSecurityProtocolMapSasl: CONTROLLER:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_DIFFHOST_SASL:SASL_PLAINTEXT,LISTENER_DOCKER_EXTERNAL_LOCALHOST_SASL:SASL_PLAINTEXT,LISTENER_DOCKER_EXTERNAL_LOCALHOST:SASL_PLAINTEXT,LISTENER_DOCKER_EXTERNAL_DIFFHOST:SASL_PLAINTEXT
      kafkaListenerSecurityProtocolMapSaslTls: CONTROLLER:PLAINTEXT,LISTENER_DOCKER_EXTERNAL_DIFFHOST_SASL:SASL_SSL,LISTENER_DOCKER_EXTERNAL_LOCALHOST_SASL:SASL_PLAINTEXT
      kafkaProcessRoles: "broker,controller"
      kafkaNodeId: "1"
      kafkaControllerQuorumVoters: "1@localhost:9094"
      kafkaControllerListenerNames: "CONTROLLER"
      # add listeners if you want to override the default listeners
      kafkaListeners: ""
      kafkaLogCleanerEnable: "true"
      kafkaLogRetentionBytes: "10737418240"
      kafkaLogRetentionCheckIntervalMs: "60000"
      kafkaLogRetentionHours: "5"
      kafkaLogSegmentBytes: "104857600"
      kafkaOffsetsTopicReplicationFactor: "1"
      kafkaTransactionStateLogMinIsr: "1"
      kafkaTransactionStateLogReplicationFactor: "1"
      kafkaClusterId: "d7b2c9f3-5a3b-4c3b-8d4a-2b3c4d5e6f7a"
      sslKeystoreLocation: "/etc/kafka/ssl/secrets/server.keystore.jks"
      sslKeystorePassword: "password"
      sslKeyPassword: "password"
      sslTruststoreLocation: "/etc/kafka/ssl/secrets/server.truststore.jks"
      sslTruststorePassword: "password"
      sslBaseMountPath: "/etc/kafka/ssl/secrets"
      # Name of an existing secret holding the keystore/truststore files
      sslSecretName: "kafka-certs"
      useSecretsForSaslCredentials: false
      saslCredentialsSecrets:
        # Name of an existing secret with "username" and "password" keys.
        # Leave empty to let the chart create the secret from the values below.
        existingSecret: ""
        username: ""
        password: ""
      saslUsername: ""
      saslPassword: ""
      # SASL mechanism: PLAIN, SCRAM-SHA-256, or SCRAM-SHA-512
      saslMechanism: "SCRAM-SHA-512"
    useTls: false
    useSasl: false
    # Format the broker storage with the SCRAM user before starting Kafka.
    # Needed for SCRAM-SHA-256/512, since the credentials live in the metadata
    # log. Ignored for the PLAIN mechanism.
    autoFormatWithScram: false
    image:
      repository: public.ecr.aws/aktosecurity/confluentinc-cp-kafka
      tag: 8.2.2-1-ubi9
    resources:
      requests:
        cpu: 1
        memory: "2Gi"
      limits:
        cpu: 2
        memory: "4Gi"
  # Kafka listener ports, picked based on kafka1.useSasl / kafka1.useTls
  ports:
    default:
    - port: 9092
      targetPort: 9092
    tls:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: ssl
      port: 9093
      targetPort: 9093
    sasl:
    - name: sasl-plaintext
      port: 9092
      targetPort: 9092
    - name: sasl-ssl
      port: 9093
      targetPort: 9093
  type: ClusterIP

keel:
  keel:
    env:
      awsAccessKeyId: ""
      awsRegion: ""
      awsSecretAccessKey: ""
      hipchatApprovalsBotName: ""
      hipchatApprovalsChannel: ""
      hipchatApprovalsPasswort: ""
      hipchatApprovalsUserName: ""
      hipchatChannels: ""
      hipchatToken: ""
      insecureRegistry: "true"
      mattermostEndpoint: ""
      notificationLevel: info
      webhookEndpoint: ""
    image:
      repository: public.ecr.aws/aktosecurity/keelhq-keel
      tag: akto_v1.0.0
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
    enabled: true
  maxUnavailable: 1
  ports:
  - name: keel
    port: 9300
    protocol: TCP
    targetPort: 9300
  replicas: 1
  serviceAccount:
    annotations: {}
  type: LoadBalancer
kubernetesClusterDomain: cluster.local
