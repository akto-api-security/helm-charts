{{ if .Values.keel.keel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto.fullname" . }}-keel
  labels:
    app: keel
  {{- include "akto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keel.replicas }}
  selector:
    matchLabels:
      app: {{ include "akto.fullname" . }}-keel
    {{- include "akto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "akto.fullname" . }}-keel
      {{- include "akto.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - command:
        - /bin/keel
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AWS_ACCESS_KEY_ID
          value: {{ quote .Values.keel.keel.env.awsAccessKeyId }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ quote .Values.keel.keel.env.awsSecretAccessKey }}
        - name: AWS_REGION
          value: {{ quote .Values.keel.keel.env.awsRegion }}
        - name: WEBHOOK_ENDPOINT
          value: {{ quote .Values.keel.keel.env.webhookEndpoint }}
        - name: MATTERMOST_ENDPOINT
          value: {{ quote .Values.keel.keel.env.mattermostEndpoint }}
        - name: HIPCHAT_TOKEN
          value: {{ quote .Values.keel.keel.env.hipchatToken }}
        - name: HIPCHAT_CHANNELS
          value: {{ quote .Values.keel.keel.env.hipchatChannels }}
        - name: HIPCHAT_APPROVALS_CHANNEL
          value: {{ quote .Values.keel.keel.env.hipchatApprovalsChannel }}
        - name: HIPCHAT_APPROVALS_BOT_NAME
          value: {{ quote .Values.keel.keel.env.hipchatApprovalsBotName }}
        - name: HIPCHAT_APPROVALS_USER_NAME
          value: {{ quote .Values.keel.keel.env.hipchatApprovalsUserName }}
        - name: HIPCHAT_APPROVALS_PASSWORT
          value: {{ quote .Values.keel.keel.env.hipchatApprovalsPasswort }}
        - name: NOTIFICATION_LEVEL
          value: {{ quote .Values.keel.keel.env.notificationLevel }}
        - name: INSECURE_REGISTRY
          value: {{ quote .Values.keel.keel.env.insecureRegistry }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.keel.keel.image.repository }}:{{ .Values.keel.keel.image.tag
          | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.keel.keel.imagePullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9300
          initialDelaySeconds: 30
          timeoutSeconds: 10
        name: keel
        ports:
        - containerPort: 9300
        resources: {{- toYaml .Values.keel.keel.resources | nindent 10 }}
      serviceAccountName: {{ include "akto.fullname" . }}-keel
{{ end }}
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "akto.fullname" . }}
  {{ if .Values.keel.keel.enabled }}
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: "@every 60m"
  {{ end }}
  labels:
  {{- include "akto.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.testing.replicas }}
  selector:
    matchLabels:
      app: {{ include "akto.fullname" . }}
    {{- include "akto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if and .Values.testing.autoScaling.enabled .Values.testing.grafanaCloud.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ quote .Values.testing.prometheusServer.port }}
        prometheus.io/path: {{ quote .Values.testing.prometheusServer.metricsEndpoint.path }}
      {{- end }}
      labels:
        app: {{ include "akto.fullname" . }}
      {{- include "akto.selectorLabels" . | nindent 8 }}
    spec:
      {{- if and (eq .Values.testing.aktoApiSecurityTesting.env.newTestingEnabled "true") .Values.testing.kafka1.useSasl }}
      initContainers:
      - name: generate-jaas-config
        image: {{ .Values.busybox.image.repository }}@{{ .Values.busybox.image.digest }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /etc/kafka/secrets
            {{- if eq .Values.testing.kafka1.env.saslMechanism "PLAIN" }}
            cat > /etc/kafka/secrets/kafka_server_jaas.conf <<EOF
            KafkaServer {
              org.apache.kafka.common.security.plain.PlainLoginModule required
              username="${KAFKA_SASL_USERNAME}"
              password="${KAFKA_SASL_PASSWORD}"
              user_${KAFKA_SASL_USERNAME}="${KAFKA_SASL_PASSWORD}";
            };
            EOF
            {{- else }}
            cat > /etc/kafka/secrets/kafka_server_jaas.conf <<EOF
            KafkaServer {
              org.apache.kafka.common.security.scram.ScramLoginModule required
              username="${KAFKA_SASL_USERNAME}"
              password="${KAFKA_SASL_PASSWORD}";
            };
            EOF
            {{- end }}
            echo "JAAS config generated successfully"
        env:
        {{- if .Values.testing.kafka1.env.useSecretsForSaslCredentials }}
        - name: KAFKA_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: username
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: password
        {{- else }}
        - name: KAFKA_SASL_USERNAME
          value: {{ quote .Values.testing.kafka1.env.saslUsername }}
        - name: KAFKA_SASL_PASSWORD
          value: {{ quote .Values.testing.kafka1.env.saslPassword }}
        {{- end }}
        volumeMounts:
        - name: kafka-jaas-config
          mountPath: /etc/kafka/secrets
      {{- end }}
      containers:
      - env:
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AKTO_ACCOUNT_NAME
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.aktoAccountName }}
        - name: IS_KUBERNETES
          value: "true"
        - name: RUNTIME_MODE
          value: "hybrid"
        - name: AKTO_CONFIG_NAME
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.aktoConfigName }}
        - name: DATABASE_ABSTRACTOR_SERVICE_URL
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.databaseAbstractorUrl}}
        - name: AUTOMATED_AGENT_BASE_URL
          value: {{ if .Values.testing.aiAutomatedTesting.enabled }}{{ printf "http://localhost:%v" .Values.testing.aiAutomatedTesting.port | quote }}{{ else }}{{ quote .Values.testing.aktoApiSecurityTesting.env.automatedAgentBaseUrl }}{{ end }}
        - name: DATABASE_ABSTRACTOR_SERVICE_TOKEN
          {{- if .Values.testing.aktoApiSecurityTesting.env.useSecretsForDatabaseAbstractorToken }}
          valueFrom:
            secretKeyRef:
              key: token
              name: {{ (tpl .Values.testing.aktoApiSecurityTesting.env.databaseAbstractorTokenSecrets.existingSecret .) | default (printf "%s-mini-testing" (include "akto.fullname" .) ) }}
            {{- else }}
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.databaseAbstractorToken }}
            {{- end }}
        - name: AKTO_KAFKA_BROKER_URL
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.kafkaBrokerUrl}} 
        - name: NEW_TESTING_ENABLED
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.newTestingEnabled}}
        - name: BLOCK_LOGS
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.blockLogs }}
        - name: AKTO_LOG_LEVEL
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.aktoLogLevel }}
        - name: MINI_TESTING_NAME
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.miniTestingName }}
        - name: PROXY_URI
          value: {{ quote .Values.tokens.env.proxyUri}}
        - name: NO_PROXY
          value: {{ quote .Values.tokens.env.noProxy}}
        - name: PUPPETEER_REPLAY_SERVICE_URL
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.puppeteerReplayServiceUrl
            }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        - name: AUTO_SCALING_ENABLED
          value: {{ quote .Values.testing.autoScaling.enabled }}
        {{ if .Values.testing.autoScaling.enabled }}
        - name: PROMETHEUS_SERVER_PORT
          value: {{ quote .Values.testing.prometheusServer.port }}
        {{ end }}
        {{- if .Values.testing.kafka1.useSasl }}
        - name: KAFKA_AUTH_ENABLED
          value: "true"
        - name: AKTO_KAFKA_SASL_ENABLED
          value: "true"
        - name: AKTO_KAFKA_SASL_MECHANISM
          value: {{ quote .Values.testing.kafka1.env.saslMechanism }}
        {{- if .Values.testing.kafka1.env.useSecretsForSaslCredentials }}
        - name: KAFKA_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: username
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: password
        - name: AKTO_KAFKA_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: username
        - name: AKTO_KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: password
        {{- else }}
        - name: KAFKA_USERNAME
          value: {{ quote .Values.testing.kafka1.env.saslUsername }}
        - name: KAFKA_PASSWORD
          value: {{ quote .Values.testing.kafka1.env.saslPassword }}
        - name: AKTO_KAFKA_USERNAME
          value: {{ quote .Values.testing.kafka1.env.saslUsername }}
        - name: AKTO_KAFKA_PASSWORD
          value: {{ quote .Values.testing.kafka1.env.saslPassword }}
        {{- end }}
        {{- end }}
        image: {{ .Values.testing.aktoApiSecurityTesting.image.repository }}:{{ .Values.testing.aktoApiSecurityTesting.image.tag
          | default .Chart.AppVersion }}
        name: akto-api-security-testing
        {{ if .Values.testing.autoScaling.enabled }}
        ports:
          - containerPort: {{ .Values.testing.prometheusServer.port }}
            name: {{ quote .Values.testing.prometheusServer.name }}
        {{ end}}
        imagePullPolicy: {{ .Values.testing.aktoApiSecurityTesting.imagePullPolicy }}
        resources: {{- toYaml .Values.testing.aktoApiSecurityTesting.resources |  nindent 10 }}
      - name: akto-api-security-puppeteer-replay
        image: {{ .Values.testing.aktoApiSecurityPuppeteerReplay.image.repository }}:{{ .Values.testing.aktoApiSecurityPuppeteerReplay.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.testing.aktoApiSecurityPuppeteerReplay.imagePullPolicy }}
        env:
        - name: LOG_SENDER_API_KEY
          {{- if .Values.testing.aktoApiSecurityPuppeteerReplay.env.useSecretsForLogSenderApiKey }}
          valueFrom:
            secretKeyRef:
              key: token
              name: {{ (tpl .Values.testing.aktoApiSecurityPuppeteerReplay.env.logSenderApiKeySecrets.existingSecret .) | default (printf "%s-puppeteer-replay" (include "akto.fullname" .) ) }}
          {{- else }}
          value: {{ quote .Values.testing.aktoApiSecurityPuppeteerReplay.env.logSenderApiKey }}
          {{- end }}
        ports:
          - containerPort: 3000
        resources: {{- toYaml .Values.testing.aktoApiSecurityPuppeteerReplay.resources |  nindent 10 }}
      - name: ai-automated-testing
        image: {{ .Values.testing.aiAutomatedTesting.image.repository }}:{{ .Values.testing.aiAutomatedTesting.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.testing.aiAutomatedTesting.imagePullPolicy }}
        ports:
          - containerPort: {{ .Values.testing.aiAutomatedTesting.port }}
        env:
        - name: DATABASE_ABSTRACTOR_TOKEN
          {{- if .Values.testing.aktoApiSecurityTesting.env.useSecretsForDatabaseAbstractorToken }}
          valueFrom:
            secretKeyRef:
              key: token
              name: {{ (tpl .Values.testing.aktoApiSecurityTesting.env.databaseAbstractorTokenSecrets.existingSecret .) | default (printf "%s-mini-testing" (include "akto.fullname" .) ) }}
          {{- else }}
          value: {{ quote .Values.testing.aktoApiSecurityTesting.env.databaseAbstractorToken }}
          {{- end }}
        resources: {{- toYaml .Values.testing.aiAutomatedTesting.resources | nindent 10 }}
      {{- if .Values.testing.agentTesting.enabled }}
      - name: agent-testing
        image: {{ .Values.testing.agentTesting.image.repository }}:{{ .Values.testing.agentTesting.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.testing.agentTesting.imagePullPolicy }}
        ports:
          - containerPort: {{ .Values.testing.agentTesting.port }}
        env:
          - name: NODE_ENV
            value: {{ quote .Values.testing.agentTesting.env.nodeEnv }}
          - name: PORT
            value: {{ quote .Values.testing.agentTesting.port }}
          - name: AGENTIC_MODE
            value: {{ quote .Values.testing.agentTesting.env.agenticMode }}
          - name: NODE_TLS_REJECT_UNAUTHORIZED
            value: {{ quote .Values.testing.agentTesting.env.nodeTlsRejectUnauthorized }}
          - name: USE_SESSION_MANAGEMENT
            value: {{ quote .Values.testing.agentTesting.env.useSessionManagement }}
          - name: AKTO_UTILITY_SERVER
            value: {{ quote .Values.testing.agentTesting.env.aktoUtilityServer }}
          {{- $llm := .Values.testing.agentTesting.env.llm }}
          {{- $sec := printf "%s-agent-testing" (include "akto.fullname" .) }}
          {{- with $llm.provider }}
          - name: LLM_PROVIDER
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.azure.endpoint }}
          - name: AZURE_OPENAI_ENDPOINT
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.azure.model }}
          - name: AZURE_OPENAI_MODEL
            value: {{ quote . }}
          {{- end }}
          {{- include "akto.agentTesting.credEnv" (list "AZURE_OPENAI_API_KEY" $llm.azure.apiKey $llm.azure.existingSecret $llm.azure.existingSecretKey $sec) | nindent 10 }}
          {{- with $llm.vertex.projectId }}
          - name: VERTEX_PROJECT_ID
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.vertex.location }}
          - name: VERTEX_LOCATION
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.vertex.endpointId }}
          - name: VERTEX_ENDPOINT_ID
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.vertex.endpointDomain }}
          - name: VERTEX_ENDPOINT_DOMAIN
            value: {{ quote . }}
          {{- end }}
          {{- include "akto.agentTesting.credEnv" (list "GOOGLE_CREDENTIALS_JSON" $llm.vertex.credentialsJson $llm.vertex.existingSecret $llm.vertex.existingSecretKey $sec) | nindent 10 }}
          {{- with $llm.anthropic.agentModelId }}
          - name: ANTHROPIC_AGENT_MODEL_ID
            value: {{ quote . }}
          {{- end }}
          {{- include "akto.agentTesting.credEnv" (list "ANTHROPIC_API_KEY" $llm.anthropic.apiKey $llm.anthropic.existingSecret $llm.anthropic.existingSecretKey $sec) | nindent 10 }}
          {{- with $llm.bedrock.awsRegion }}
          - name: AWS_REGION
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.bedrock.inferenceProfilePrefix }}
          - name: BEDROCK_INFERENCE_PROFILE_PREFIX
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.bedrock.sonnetModelId }}
          - name: BEDROCK_SONNET_MODEL_ID
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.bedrock.haikuModelId }}
          - name: BEDROCK_HAIKU_MODEL_ID
            value: {{ quote . }}
          {{- end }}
          {{- with $llm.bedrock.agentModelId }}
          - name: BEDROCK_AGENT_MODEL_ID
            value: {{ quote . }}
          {{- end }}
          {{- include "akto.agentTesting.credEnv" (list "AWS_BEARER_TOKEN_BEDROCK" $llm.bedrock.bearerToken $llm.bedrock.existingSecret $llm.bedrock.existingSecretKey $sec) | nindent 10 }}
        resources: {{- toYaml .Values.testing.agentTesting.resources | nindent 10 }}
      {{- end }}
    {{ if eq .Values.testing.aktoApiSecurityTesting.env.newTestingEnabled "true" }}
      - env:
        - name: MY_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KAFKA_ADVERTISED_LISTENERS
          value: >-
            {{- if .Values.testing.kafka1.env.kafkaAdvertisedListeners }}
              {{ .Values.testing.kafka1.env.kafkaAdvertisedListeners }}
            {{- else if and .Values.testing.kafka1.useSasl .Values.testing.kafka1.useTls }}
              LISTENER_DOCKER_EXTERNAL_LOCALHOST_SASL://localhost:29092, LISTENER_DOCKER_EXTERNAL_DIFFHOST_SASL://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ (index .Values.testing.ports.sasl 1).port }}
            {{- else if .Values.testing.kafka1.useSasl }}
              LISTENER_DOCKER_EXTERNAL_LOCALHOST_SASL://localhost:29092, LISTENER_DOCKER_EXTERNAL_DIFFHOST_SASL://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ (index .Values.testing.ports.sasl 0).port }}
            {{- else if .Values.testing.kafka1.useTls }}
              LISTENER_DOCKER_EXTERNAL_LOCALHOST://localhost:29092, LISTENER_DOCKER_EXTERNAL_DIFFHOST://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ (index .Values.testing.ports.tls 0).port }},LISTENER_DOCKER_EXTERNAL_DIFFHOST_ENCRYPTED://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ (index .Values.testing.ports.tls 1).port }}
            {{- else }}
              LISTENER_DOCKER_EXTERNAL_LOCALHOST://localhost:29092, LISTENER_DOCKER_EXTERNAL_DIFFHOST://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ (index .Values.testing.ports.default 0).port }}
            {{- end }}
        - name: KAFKA_BROKER_ID
          value: {{ quote .Values.testing.kafka1.env.kafkaBrokerId }}
        - name: KAFKA_CLEANUP_POLICY
          value: {{ quote .Values.testing.kafka1.env.kafkaCleanupPolicy }}
        - name: KAFKA_CREATE_TOPICS
          value: {{ quote .Values.testing.kafka1.env.kafkaCreateTopics }}
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: >-
            {{- if .Values.testing.kafka1.env.kafkaAdvertisedListeners }}
              {{ .Values.testing.kafka1.env.kafkaInterBrokerListenerName }}
            {{- else if .Values.testing.kafka1.useSasl }}
              LISTENER_DOCKER_EXTERNAL_LOCALHOST_SASL
            {{- else }}
              {{ .Values.testing.kafka1.env.kafkaInterBrokerListenerName }}
            {{- end }}
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: >-
            {{- if and .Values.testing.kafka1.useSasl .Values.testing.kafka1.useTls }}
              {{ .Values.testing.kafka1.env.kafkaListenerSecurityProtocolMapSaslTls }}
            {{- else if .Values.testing.kafka1.useSasl }}
              {{ .Values.testing.kafka1.env.kafkaListenerSecurityProtocolMapSasl }}
            {{- else if .Values.testing.kafka1.useTls }}
              {{ .Values.testing.kafka1.env.kafkaListenerSecurityProtocolMapSsl }}
            {{- else }}
              {{ .Values.testing.kafka1.env.kafkaListenerSecurityProtocolMap }}
            {{- end }}
        - name: KAFKA_PROCESS_ROLES
          value: {{ quote .Values.testing.kafka1.env.kafkaProcessRoles }}
        - name: KAFKA_NODE_ID
          value: {{ quote .Values.testing.kafka1.env.kafkaNodeId }}
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: {{ quote .Values.testing.kafka1.env.kafkaControllerQuorumVoters }}
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: {{ quote .Values.testing.kafka1.env.kafkaControllerListenerNames }}
        - name: KAFKA_LISTENERS
          value: >-
            {{- if .Values.testing.kafka1.env.kafkaListeners }}
              {{ .Values.testing.kafka1.env.kafkaListeners }}
            {{- else if .Values.testing.kafka1.useSasl }}
              CONTROLLER://0.0.0.0:9094,LISTENER_DOCKER_EXTERNAL_LOCALHOST_SASL://0.0.0.0:29092,LISTENER_DOCKER_EXTERNAL_DIFFHOST_SASL://0.0.0.0:{{ if .Values.testing.kafka1.useTls }}{{ (index .Values.testing.ports.sasl 1).port }}{{ else }}{{ (index .Values.testing.ports.sasl 0).port }}{{ end }}
            {{- else if .Values.testing.kafka1.useTls }}
              CONTROLLER://0.0.0.0:9094,LISTENER_DOCKER_EXTERNAL_LOCALHOST://0.0.0.0:29092,LISTENER_DOCKER_EXTERNAL_DIFFHOST://0.0.0.0:{{ (index .Values.testing.ports.tls 0).port }},LISTENER_DOCKER_EXTERNAL_DIFFHOST_ENCRYPTED://0.0.0.0:{{ (index .Values.testing.ports.tls 1).port }}
            {{- else }}
              CONTROLLER://0.0.0.0:9094,LISTENER_DOCKER_EXTERNAL_LOCALHOST://0.0.0.0:29092,LISTENER_DOCKER_EXTERNAL_DIFFHOST://0.0.0.0:{{ (index .Values.testing.ports.default 0).port }}
            {{- end }}
        - name: KAFKA_LOG_CLEANER_ENABLE
          value: {{ quote .Values.testing.kafka1.env.kafkaLogCleanerEnable }}
        - name: KAFKA_LOG_RETENTION_BYTES
          value: {{ quote .Values.testing.kafka1.env.kafkaLogRetentionBytes }}
        - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
          value: {{ quote .Values.testing.kafka1.env.kafkaLogRetentionCheckIntervalMs }}
        - name: KAFKA_LOG_RETENTION_HOURS
          value: {{ quote .Values.testing.kafka1.env.kafkaLogRetentionHours }}
        - name: KAFKA_LOG_SEGMENT_BYTES
          value: {{ quote .Values.testing.kafka1.env.kafkaLogSegmentBytes }}
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: {{ quote .Values.testing.kafka1.env.kafkaOffsetsTopicReplicationFactor
            }}
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: {{ quote .Values.testing.kafka1.env.kafkaTransactionStateLogMinIsr }}
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: {{ quote .Values.testing.kafka1.env.kafkaTransactionStateLogReplicationFactor
            }}
        - name: CLUSTER_ID
          value: {{ quote .Values.testing.kafka1.env.kafkaClusterId }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        {{- if .Values.testing.kafka1.useTls }}
        - name: KAFKA_SSL_KEYSTORE_LOCATION
          value: {{ quote .Values.testing.kafka1.env.sslKeystoreLocation }}
        - name: KAFKA_SSL_KEYSTORE_PASSWORD
          value: {{ quote .Values.testing.kafka1.env.sslKeystorePassword }}
        - name: KAFKA_SSL_KEY_PASSWORD
          value: {{ quote .Values.testing.kafka1.env.sslKeyPassword }}
        - name: KAFKA_SSL_TRUSTSTORE_LOCATION
          value: {{ quote .Values.testing.kafka1.env.sslTruststoreLocation }}
        - name: KAFKA_SSL_TRUSTSTORE_PASSWORD
          value: {{ quote .Values.testing.kafka1.env.sslTruststorePassword }}
        {{- end }}
        {{- if .Values.testing.kafka1.useSasl }}
        - name: KAFKA_OPTS
          value: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"
        - name: KAFKA_SASL_ENABLED_MECHANISMS
          value: {{ quote .Values.testing.kafka1.env.saslMechanism }}
        - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
          value: {{ quote .Values.testing.kafka1.env.saslMechanism }}
        {{- end }}
        {{- if and .Values.testing.kafka1.useSasl (or (eq .Values.testing.kafka1.env.saslMechanism "SCRAM-SHA-256") (eq .Values.testing.kafka1.env.saslMechanism "SCRAM-SHA-512")) }}
        - name: KAFKA_SCRAM_USERNAME
          {{- if .Values.testing.kafka1.env.useSecretsForSaslCredentials }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: username
          {{- else }}
          value: {{ quote .Values.testing.kafka1.env.saslUsername }}
          {{- end }}
        - name: KAFKA_SCRAM_PASSWORD
          {{- if .Values.testing.kafka1.env.useSecretsForSaslCredentials }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.testing.kafka1.env.saslCredentialsSecrets.existingSecret | default (printf "%s-mini-testing-sasl" (include "akto.fullname" .)) }}
              key: password
          {{- else }}
          value: {{ quote .Values.testing.kafka1.env.saslPassword }}
          {{- end }}
        - name: KAFKA_SCRAM_MECHANISM
          value: {{ quote .Values.testing.kafka1.env.saslMechanism }}
        {{- end }}
        image: {{ .Values.testing.kafka1.image.repository }}:{{ .Values.testing.kafka1.image.tag
          | default .Chart.AppVersion }}
        {{- if .Values.testing.kafka1.autoFormatWithScram }}
        command:
          - bash
          - -c
          - |
            # Format storage with the SCRAM user whenever the data dir is fresh.
            # The broker storage is ephemeral here, so this runs on every new pod.
            if [ ! -f /var/lib/kafka/data/.kafka-formatted ]; then
              echo "Formatting Kafka storage with SCRAM user"

              # Generate server.properties using Confluent's configure script
              /etc/confluent/docker/configure

              kafka-storage format \
                --config /etc/kafka/kafka.properties \
                --cluster-id "${CLUSTER_ID}" \
                --add-scram "${KAFKA_SCRAM_MECHANISM}=[name=${KAFKA_SCRAM_USERNAME},password=${KAFKA_SCRAM_PASSWORD}]" || {
                  echo "ERROR: Failed to format storage with SCRAM"
                  exit 1
                }

              touch /var/lib/kafka/data/.kafka-formatted
              echo "SUCCESS: Storage formatted with SCRAM user"
            else
              echo "Storage already formatted - skipping format step"
            fi

            echo "Starting Kafka broker with SASL authentication..."
            exec /etc/confluent/docker/run
        {{- end }}
        name: kafka1
        ports:
        - containerPort: 9092
        - containerPort: 9093
        - containerPort: 29092
        - containerPort: 9999
        resources: {{- toYaml .Values.testing.kafka1.resources | nindent 10 }}
        {{- if or .Values.testing.kafka1.useSasl .Values.testing.kafka1.useTls }}
        volumeMounts:
        {{- if .Values.testing.kafka1.useSasl }}
        - name: kafka-jaas-config
          mountPath: /etc/kafka/secrets
        {{- end }}
        {{- if .Values.testing.kafka1.useTls }}
        - name: kafka-certs
          mountPath: {{ quote .Values.testing.kafka1.env.sslBaseMountPath }}
        {{- end }}
        {{- end }}
    {{end}}
      restartPolicy: Always
      {{- if and (eq .Values.testing.aktoApiSecurityTesting.env.newTestingEnabled "true") (or .Values.testing.kafka1.useSasl .Values.testing.kafka1.useTls) }}
      volumes:
      {{- if .Values.testing.kafka1.useSasl }}
      - name: kafka-jaas-config
        emptyDir: {}
      {{- end }}
      {{- if .Values.testing.kafka1.useTls }}
      - name: kafka-certs
        secret:
          secretName: {{ quote .Values.testing.kafka1.env.sslSecretName }}
      {{- end }}
      {{- end }}